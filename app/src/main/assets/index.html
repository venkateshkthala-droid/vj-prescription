 const rel=n=>{const r=n.getBoundingClientRect();return{l:(r.left-R.left)*s,t:(r.top-R.top)*s,w:r.width*s,h:r.height*s}};
 const fz=n=>parseFloat(getComputedStyle(n).fontSize)*s;
 const txt=(t,n,o={})=>{if(!t)return;const r=rel(n),f=fz(n);x.font=(o.b?'700 ':'')+f+'px '+FF;x.fillStyle=o.c||'#0a1a3a';x.textAlign=o.a||'left';x.textBaseline='middle';x.fillText(t,o.a==='right'?r.l+r.w-f*.3:r.l+f*.3,r.t+(r.h-(n.tagName==='INPUT'?parseFloat(getComputedStyle(n).paddingBottom)*s:0))/2,r.w-f*.6)};
 const ln=(n,top,col,dash)=>{const r=rel(n),y=top?r.t:r.t+r.h;x.strokeStyle=col;x.lineWidth=1.5;x.setLineDash(dash?[3,3]:[]);x.beginPath();x.moveTo(r.l,y);x.lineTo(r.l+r.w,y);x.stroke()};
 const wrapDraw=t=>{if(!t||!t.value)return;const r=rel(t),f=fz(t),cs=getComputedStyle(t),pd=parseFloat(cs.paddingTop)*s,lh=(parseFloat(cs.lineHeight)*s)||f*1.4,out=[];x.font=f+'px '+FF;x.fillStyle='#0a1a3a';x.textAlign='left';x.textBaseline='middle';
  t.value.split(/\r?\n/).forEach(p=>{let l='';p.split(' ').forEach(w=>{const q=l?l+' '+w:w;if(x.measureText(q).width>r.w-f*.6&&l){out.push(l);l=w}else l=q});out.push(l)});
  out.forEach((l,i)=>{if(pd+(i+1)*lh<=r.h+2)x.fillText(l,r.l+f*.3,r.t+pd+lh*(i+.5))})};
 el.querySelectorAll('.f input').forEach(i=>txt(i.value,i));
 el.querySelectorAll('.rx').forEach(n=>txt(n.textContent,n,{b:1,c:'#0b3b7a'}));
 el.querySelectorAll('.hd').forEach(n=>{txt(n.textContent,n,{b:1,c:'#5b6b85'});ln(n,0,'#9fb0cc')});
 el.querySelectorAll('.row').forEach(r=>{wrapDraw(r.querySelector('textarea'));ln(r,0,'#b5c2d8',1)});
 const nt=el.querySelector('.notes');if(nt)wrapDraw(nt);
 el.querySelectorAll('.sign').forEach(n=>{ln(n,1,'#9fb0cc');const s2=n.querySelector('select');txt(s2.selectedOptions[0].textContent,s2,{b:1,a:'right'});txt(n.querySelector('small').textContent,n.querySelector('small'),{a:'right',c:'#5b6b85'})});
 return c}
function msgText(){const s=P.querySelector('select'),L=['*VJ POLY CLINIC*'];if(s)L.push(s.selectedOptions[0].textContent+' ('+s.value.split('|')[1]+')');return L.join('\n')}
const cap=()=>{const s=P.querySelector('select');return 'VJ POLY CLINIC'+(s?'\n'+s.selectedOptions[0].textContent+' ('+s.value.split('|')[1]+')':'')};
function waUrl(n){return 'https://wa.me/'+n+'?text='+encodeURIComponent(cap()+'\n\nPrescription PDF attached.')}
let DL=null;
if(window.claude&&claude.use)claude.use('downloads').then(d=>{if(d)DL=d}).catch(()=>{});
async function makePdf(){await loadJS();const{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
 const pg=[...P.children];for(let i=0;i<pg.length;i++){const c=await pageCanvas(pg[i]);if(i)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297)}
 const v=vals(),nm=(v.name||'Patient').replace(/[^\w\- ]+/g,'').trim().replace(/ +/g,'_')||'Patient';
 return{fn:['VJ Polyclinic',nm.replace(/_/g,' '),($('dob').value||'').split('-').reverse().join('-')].filter(Boolean).join(' - ')+'.pdf',bl:doc.output('blob')}}
async function saveFile(fn,bl){if(DL)await DL.save({filename:fn,data:bl});else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}}
async function task(id,run){const b=$(id);if(b.dataset.busy)return;b.dataset.busy=1;const o=b.dataset.o||b.textContent;b.dataset.o=o;b.textContent='Preparing…';
 try{await run()}catch(e){if(!e||(e.code!=='declined'&&e.name!=='AbortError')){b.textContent=o;flash(id,'Could not export')}}
 delete b.dataset.busy;if(b.textContent==='Preparing…')b.textContent=o}
$('pdf').onclick=()=>task('pdf',async()=>{const f=await makePdf();await saveFile(f.fn,f.bl)});
let W=null;const WL='Share via WhatsApp';
const waNum=()=>{let n=$('phone').value.replace(/\D/g,'');if(n.length===10)n='91'+n;else if(n.length===11&&n[0]==='0')n='91'+n.slice(1);return n};
const openU=u=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()};
$('phone').addEventListener('input',()=>{W=null;$('wa').dataset.o=WL;$('wa').textContent=WL});
function mv(d){const c=P.children[act],o=P.children[act+d];if(!c||!o)return;if(d<0)P.insertBefore(c,o);else P.insertBefore(o,c);setAct(act+d);c.scrollIntoView({behavior:'smooth',block:'center'})}
$('mvf').onclick=()=>mv(-1);$('mvb').onclick=()=>mv(1);
let pre=null,ver=0,wt=0;
function warm(){const v=ver;makePdf().then(f=>{f.file=new File([f.bl],f.fn,{type:'application/pdf'});if(v===ver)pre=f}).catch(()=>{})}
function dirty(){pre=null;ver++;clearTimeout(wt);wt=setTimeout(warm,1000)}
new MutationObserver(dirty).observe(P,{childList:true,subtree:true});P.addEventListener('input',dirty);P.addEventListener('change',dirty);$('dob').addEventListener('input',dirty);$('dob').addEventListener('change',dirty);
$('wa').onclick=()=>{const n=waNum();if(n.length<11){flash('wa','Enter phone number');return}
 if(pre){saveFile(pre.fn,pre.bl).catch(()=>{});openU(waUrl(n));return}
 task('wa',async()=>{const f=await makePdf();pre=f;await saveFile(f.fn,f.bl);openU(waUrl(n))})};

build({date:today()},[{}]);render();

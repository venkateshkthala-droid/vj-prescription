plugins { id 'com.android.application' }
android {
    namespace 'in.vjpolyclinic.rx'
    compileSdk 34
    defaultConfig {
        applicationId "in.vjpolyclinic.rx"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // debug key so the APK installs directly
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
